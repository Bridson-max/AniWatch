<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniStream</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --card: #1a1a26;
    --border: #2a2a3d;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --pink: #ec4899;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
  
  /* NAV */
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--accent2), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
  .nav-links { display: flex; gap: 20px; }
  .nav-links span { color: var(--muted); cursor: pointer; font-size: 0.9rem; transition: color 0.2s; }
  .nav-links span:hover, .nav-links span.active { color: var(--text); }
  .search-bar { display: flex; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; gap: 8px; width: 260px; }
  .search-bar input { background: none; border: none; outline: none; color: var(--text); font-size: 0.9rem; width: 100%; }
  .search-bar svg { color: var(--muted); flex-shrink: 0; }

  /* HERO */
  .hero { position: relative; height: 460px; overflow: hidden; display: flex; align-items: flex-end; }
  .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center top; transition: all 0.6s; }
  .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to right, rgba(10,10,15,0.98) 30%, rgba(10,10,15,0.4) 100%), linear-gradient(to top, rgba(10,10,15,1) 0%, transparent 60%); }
  .hero-content { position: relative; z-index: 2; padding: 40px 32px; max-width: 520px; }
  .hero-badge { display: inline-block; background: var(--accent); color: #fff; font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 1px; margin-bottom: 12px; }
  .hero-title { font-size: 2.2rem; font-weight: 800; line-height: 1.15; margin-bottom: 10px; }
  .hero-meta { display: flex; gap: 14px; margin-bottom: 12px; font-size: 0.82rem; color: var(--muted); }
  .hero-meta .score { color: #facc15; font-weight: 700; }
  .hero-desc { font-size: 0.88rem; color: var(--muted); line-height: 1.6; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hero-btns { display: flex; gap: 10px; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; padding: 10px 22px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; transition: opacity 0.2s; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid var(--border); padding: 10px 22px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
  .btn-secondary:hover { background: rgba(255,255,255,0.18); }
  .hero-dots { position: absolute; bottom: 20px; right: 32px; display: flex; gap: 6px; z-index: 3; }
  .hero-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); cursor: pointer; transition: background 0.2s; }
  .hero-dots span.active { background: var(--accent2); }

  /* SECTIONS */
  main { padding: 0 24px; }
  .section { margin: 32px 0; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .section-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; width: 4px; height: 18px; background: linear-gradient(to bottom, var(--accent), var(--pink)); border-radius: 2px; display: block; }
  .see-all { color: var(--accent2); font-size: 0.82rem; cursor: pointer; }

  /* ANIME GRID */
  .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .anime-card { background: var(--card); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
  .anime-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(124,58,237,0.3); }
  .anime-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: var(--border); }
  .anime-card .card-info { padding: 8px 10px; }
  .anime-card .card-title { font-size: 0.82rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .anime-card .card-ep { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
  .anime-card .card-score { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.75); color: #facc15; font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  .anime-card .card-type { position: absolute; top: 8px; left: 8px; background: var(--accent); color: #fff; font-size: 0.62rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px; }

  /* HORIZONTAL SCROLL */
  .h-scroll { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .h-scroll::-webkit-scrollbar { height: 4px; }
  .h-scroll::-webkit-scrollbar-track { background: transparent; }
  .h-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .h-scroll .anime-card { min-width: 148px; flex-shrink: 0; }

  /* GENRES */
  .genre-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .genre-pill { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
  .genre-pill:hover { border-color: var(--accent2); color: var(--accent2); }
  .genre-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* WATCH VIEW */
  .watch-view { display: none; }
  .watch-view.visible { display: block; }
  .home-view { display: block; }
  .home-view.hidden { display: none; }

  .watch-hero { display: grid; grid-template-columns: 1fr 320px; gap: 20px; padding: 20px 0; }
  .player-wrap { background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/9; position: relative; }
  .player-wrap iframe { width: 100%; height: 100%; border: none; }
  .player-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 12px; }
  .player-placeholder svg { opacity: 0.3; }
  .watch-sidebar { display: flex; flex-direction: column; gap: 14px; }
  .watch-info h1 { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; }
  .watch-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
  .watch-synopsis { font-size: 0.83rem; color: var(--muted); line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; margin-top: 10px; }
  .watch-synopsis.expanded { -webkit-line-clamp: unset; }
  
  /* EPISODES */
  .ep-list-header { font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; }
  .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; max-height: 280px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .ep-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 4px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.2s; }
  .ep-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .ep-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* SEARCH RESULTS */
  .search-view { display: none; }
  .search-view.visible { display: block; }

  .page-title { font-size: 1.4rem; font-weight: 800; margin: 24px 0 18px; }
  .results-count { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }

  /* LOADING */
  .skeleton { background: linear-gradient(90deg, var(--card) 25%, var(--border) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius); }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .sk-card { aspect-ratio: 2/3; border-radius: var(--radius); }
  .sk-hero { height: 460px; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 0.85rem; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* RESPONSIVE */
  @media(max-width:768px){
    .watch-hero { grid-template-columns: 1fr; }
    .nav-links { display: none; }
    .hero { height: 380px; }
    .hero-title { font-size: 1.6rem; }
    .search-bar { width: 180px; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo" onclick="goHome()">AniStream</div>
  <div class="nav-links">
    <span class="active" onclick="goHome()">Home</span>
    <span onclick="loadByFilter('airing')">Airing</span>
    <span onclick="loadByFilter('upcoming')">Upcoming</span>
    <span onclick="loadByFilter('bypopularity')">Popular</span>
    <span onclick="loadMovies()">Movies</span>
  </div>
  <div class="search-bar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="searchInput" type="text" placeholder="Search anime..." onkeydown="handleSearch(event)">
  </div>
</nav>

<div class="home-view" id="homeView">
  <!-- HERO -->
  <div class="hero" id="heroSection">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content" id="heroContent">
      <div class="skeleton" style="height:20px;width:80px;border-radius:20px;margin-bottom:12px;"></div>
      <div class="skeleton" style="height:40px;width:300px;margin-bottom:10px;"></div>
      <div class="skeleton" style="height:60px;width:400px;margin-bottom:20px;"></div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </div>

  <main>
    <!-- GENRES -->
    <div class="section">
      <div class="section-header"><div class="section-title">Browse by Genre</div></div>
      <div class="genre-pills" id="genrePills"></div>
    </div>

    <!-- TRENDING -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">🔥 Trending Now</div>
        <span class="see-all" onclick="loadByFilter('bypopularity')">See all</span>
      </div>
      <div class="h-scroll" id="trendingRow"></div>
    </div>

    <!-- SEASONAL -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">📅 This Season</div>
        <span class="see-all" onclick="loadByFilter('airing')">See all</span>
      </div>
      <div class="h-scroll" id="seasonalRow"></div>
    </div>

    <!-- TOP RATED -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">⭐ Top Rated</div>
        <span class="see-all" onclick="loadByFilter('score')">See all</span>
      </div>
      <div class="anime-grid" id="topRatedGrid"></div>
    </div>
  </main>
</div>

<!-- WATCH VIEW -->
<div class="watch-view" id="watchView">
  <main>
    <div style="margin:16px 0;">
      <span style="color:var(--muted);font-size:0.82rem;cursor:pointer;" onclick="goHome()">← Back to Home</span>
    </div>
    <div class="watch-hero">
      <div>
        <div class="player-wrap" id="playerWrap">
          <div class="player-placeholder" id="playerPlaceholder">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <p style="font-size:0.9rem;">Select an episode to watch</p>
          </div>
        </div>
        <div class="watch-info" style="margin-top:14px;">
          <h1 id="watchTitle">—</h1>
          <div class="watch-meta" id="watchMeta"></div>
          <div class="watch-synopsis" id="watchSynopsis" onclick="toggleSynopsis()"></div>
        </div>
      </div>
      <div class="watch-sidebar">
        <div>
          <div class="ep-list-header">Episodes</div>
          <div class="ep-grid" id="epGrid"></div>
        </div>
        <div>
          <div class="ep-list-header">Related Anime</div>
          <div id="relatedList"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header"><div class="section-title">More Like This</div></div>
      <div class="h-scroll" id="recommendedRow"></div>
    </div>
  </main>
</div>

<!-- SEARCH VIEW -->
<div class="search-view" id="searchView">
  <main>
    <div class="page-title" id="searchTitle">Search Results</div>
    <div class="results-count" id="resultsCount"></div>
    <div class="anime-grid" id="searchGrid"></div>
    <div style="text-align:center;margin:24px 0;" id="loadMoreWrap">
      <button class="btn-secondary" id="loadMoreBtn" onclick="loadMoreResults()">Load More</button>
    </div>
  </main>
</div>

<!-- FILTER VIEW -->
<div class="search-view" id="filterView">
  <main>
    <div class="page-title" id="filterTitle">Anime</div>
    <div class="anime-grid" id="filterGrid"></div>
    <div style="text-align:center;margin:24px 0;">
      <button class="btn-secondary" onclick="loadFilterMore()">Load More</button>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://api.jikan.moe/v4';
let heroAnimes = [];
let heroIdx = 0;
let heroTimer;
let currentAnime = null;
let currentEp = 1;
let searchPage = 1;
let lastQuery = '';
let filterPage = 1;
let lastFilter = '';
let lastFilterType = '';

// ---- JIKAN RATE LIMIT QUEUE ----
const reqQueue = [];
let processing = false;
async function jikan(url) {
  return new Promise((res, rej) => {
    reqQueue.push({ url, res, rej });
    if (!processing) processQueue();
  });
}
async function processQueue() {
  processing = true;
  while (reqQueue.length) {
    const { url, res, rej } = reqQueue.shift();
    try {
      const r = await fetch(API + url);
      const d = await r.json();
      res(d);
    } catch (e) { rej(e); }
    if (reqQueue.length) await delay(400);
  }
  processing = false;
}
const delay = ms => new Promise(r => setTimeout(r, ms));

// ---- GENRES ----
const genres = [
  {id:1,name:'Action'},{id:2,name:'Adventure'},{id:4,name:'Comedy'},{id:8,name:'Drama'},
  {id:10,name:'Fantasy'},{id:14,name:'Horror'},{id:22,name:'Romance'},{id:24,name:'Sci-Fi'},
  {id:27,name:'Shounen'},{id:42,name:'Seinen'},{id:36,name:'Slice of Life'},{id:37,name:'Supernatural'},
  {id:7,name:'Mystery'},{id:18,name:'Music'},{id:38,name:'Military'}
];

function renderGenres() {
  const c = document.getElementById('genrePills');
  c.innerHTML = genres.map(g => `<span class="genre-pill" onclick="loadGenre(${g.id},'${g.name}')">${g.name}</span>`).join('');
}

// ---- HERO ----
async function loadHero() {
  const d = await jikan('/top/anime?filter=airing&limit=8');
  heroAnimes = d.data || [];
  renderHeroDots();
  showHero(0);
  heroTimer = setInterval(() => showHero((heroIdx + 1) % heroAnimes.length), 5000);
}

function renderHeroDots() {
  const c = document.getElementById('heroDots');
  c.innerHTML = heroAnimes.map((_, i) => `<span class="${i===0?'active':''}" onclick="showHero(${i})"></span>`).join('');
}

function showHero(i) {
  heroIdx = i;
  const a = heroAnimes[i];
  if (!a) return;
  document.getElementById('heroBg').style.backgroundImage = `url(${a.images?.jpg?.large_image_url || ''})`;
  document.getElementById('heroContent').innerHTML = `
    <div class="hero-badge">${a.status || 'AIRING'}</div>
    <div class="hero-title">${a.title}</div>
    <div class="hero-meta">
      <span class="score">★ ${a.score || 'N/A'}</span>
      <span>${a.type || 'TV'}</span>
      <span>${a.episodes ? a.episodes + ' eps' : 'Ongoing'}</span>
      ${(a.genres||[]).slice(0,2).map(g=>`<span>${g.name}</span>`).join('')}
    </div>
    <div class="hero-desc">${a.synopsis || ''}</div>
    <div class="hero-btns">
      <button class="btn-primary" onclick="openWatch(${a.mal_id})">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Watch Now
      </button>
      <button class="btn-secondary" onclick="openWatch(${a.mal_id})">More Info</button>
    </div>
  `;
  document.querySelectorAll('.hero-dots span').forEach((s,j) => s.classList.toggle('active', j===i));
}

// ---- ROWS ----
function animeCard(a) {
  const img = a.images?.jpg?.image_url || '';
  const score = a.score ? `<div class="card-score">★ ${a.score}</div>` : '';
  const type = a.type ? `<div class="card-type">${a.type}</div>` : '';
  return `
    <div class="anime-card" onclick="openWatch(${a.mal_id})">
      ${type}${score}
      <img src="${img}" alt="${a.title}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'225\'><rect fill=\'%231a1a26\' width=\'150\' height=\'225\'/></svg>'">
      <div class="card-info">
        <div class="card-title">${a.title}</div>
        <div class="card-ep">${a.episodes ? a.episodes + ' eps' : a.status || ''}</div>
      </div>
    </div>`;
}

async function loadTrending() {
  const d = await jikan('/top/anime?filter=bypopularity&limit=12');
  document.getElementById('trendingRow').innerHTML = (d.data||[]).map(animeCard).join('');
}
async function loadSeasonal() {
  const d = await jikan('/seasons/now?limit=12');
  document.getElementById('seasonalRow').innerHTML = (d.data||[]).map(animeCard).join('');
}
async function loadTopRated() {
  const d = await jikan('/top/anime?filter=score&limit=12');
  document.getElementById('topRatedGrid').innerHTML = (d.data||[]).map(animeCard).join('');
}

// ---- FILTER VIEW ----
async function loadByFilter(filter) {
  filterPage = 1; lastFilter = filter; lastFilterType = 'top';
  showView('filterView');
  const labels = {bypopularity:'Most Popular',airing:'Currently Airing',upcoming:'Upcoming',score:'Top Rated'};
  document.getElementById('filterTitle').textContent = labels[filter] || 'Anime';
  const d = await jikan(`/top/anime?filter=${filter}&limit=24`);
  document.getElementById('filterGrid').innerHTML = (d.data||[]).map(animeCard).join('');
}
async function loadMovies() {
  filterPage = 1; lastFilter = 'movie'; lastFilterType = 'movie';
  showView('filterView');
  document.getElementById('filterTitle').textContent = 'Anime Movies';
  const d = await jikan('/top/anime?type=movie&limit=24');
  document.getElementById('filterGrid').innerHTML = (d.data||[]).map(animeCard).join('');
}
async function loadGenre(id, name) {
  filterPage = 1; lastFilter = id; lastFilterType = 'genre';
  showView('filterView');
  document.getElementById('filterTitle').textContent = name + ' Anime';
  const d = await jikan(`/anime?genres=${id}&order_by=score&sort=desc&limit=24`);
  document.getElementById('filterGrid').innerHTML = (d.data||[]).map(animeCard).join('');
}
async function loadFilterMore() {
  filterPage++;
  let url;
  if (lastFilterType === 'top') url = `/top/anime?filter=${lastFilter}&limit=24&page=${filterPage}`;
  else if (lastFilterType === 'movie') url = `/top/anime?type=movie&limit=24&page=${filterPage}`;
  else url = `/anime?genres=${lastFilter}&order_by=score&sort=desc&limit=24&page=${filterPage}`;
  const d = await jikan(url);
  document.getElementById('filterGrid').insertAdjacentHTML('beforeend', (d.data||[]).map(animeCard).join(''));
}

// ---- WATCH ----
async function openWatch(id) {
  showView('watchView');
  document.getElementById('watchTitle').textContent = 'Loading...';
  document.getElementById('watchMeta').innerHTML = '';
  document.getElementById('watchSynopsis').textContent = '';
  document.getElementById('epGrid').innerHTML = '';
  document.getElementById('relatedList').innerHTML = '';
  document.getElementById('recommendedRow').innerHTML = '';
  resetPlayer();

  const d = await jikan(`/anime/${id}`);
  const a = d.data;
  currentAnime = a;
  currentEp = 1;

  document.getElementById('watchTitle').textContent = a.title;
  document.getElementById('watchMeta').innerHTML = `
    <span class="score" style="color:#facc15;font-weight:700">★ ${a.score || 'N/A'}</span>
    <span>${a.type || 'TV'}</span>
    <span>${a.episodes ? a.episodes + ' eps' : 'Ongoing'}</span>
    <span>${a.year || ''}</span>
    <span>${a.status || ''}</span>
    ${(a.genres||[]).map(g=>`<span>${g.name}</span>`).join('')}
  `;
  document.getElementById('watchSynopsis').textContent = a.synopsis || '';

  // Episodes
  const totalEps = a.episodes || 26;
  const epHtml = Array.from({length: Math.min(totalEps, 150)}, (_,i) =>
    `<button class="ep-btn ${i===0?'active':''}" onclick="playEp(${i+1}, this)">${i+1}</button>`
  ).join('');
  document.getElementById('epGrid').innerHTML = epHtml || '<p style="color:var(--muted);font-size:0.8rem;">Episode list unavailable</p>';

  // Play ep 1 immediately
  playEp(1, document.querySelector('.ep-btn'));

  // Related
  const rd = await jikan(`/anime/${id}/recommendations`);
  const related = (rd.data||[]).slice(0,5);
  document.getElementById('relatedList').innerHTML = related.map(r => `
    <div onclick="openWatch(${r.entry.mal_id})" style="display:flex;gap:10px;margin-bottom:10px;cursor:pointer;background:var(--card);border-radius:8px;overflow:hidden;padding:8px;">
      <img src="${r.entry.images?.jpg?.image_url}" style="width:44px;height:62px;object-fit:cover;border-radius:4px;flex-shrink:0;">
      <div style="font-size:0.78rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${r.entry.title}</div>
    </div>`).join('');

  // Recommended row
  document.getElementById('recommendedRow').innerHTML = related.slice(0,8).map(r => animeCard({...r.entry})).join('');

  window.scrollTo({top:0,behavior:'smooth'});
}

function playEp(ep, btn) {
  currentEp = ep;
  document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const wrap = document.getElementById('playerWrap');
  if (!currentAnime) return;

  // Use gogoanime embed via AllAnime / embed.su / vidsrc
  const titleSlug = currentAnime.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const malId = currentAnime.mal_id;

  // Try multiple embed sources - let user pick
  const src = `https://www.2anime.xyz/embed/${malId}/${ep}`;
  wrap.innerHTML = `
    <iframe src="${src}" allowfullscreen scrolling="no" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture"></iframe>
  `;
}

function resetPlayer() {
  document.getElementById('playerWrap').innerHTML = `
    <div class="player-placeholder" id="playerPlaceholder">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <p style="font-size:0.9rem;">Select an episode to watch</p>
    </div>`;
}

function toggleSynopsis() {
  document.getElementById('watchSynopsis').classList.toggle('expanded');
}

// ---- SEARCH ----
function handleSearch(e) {
  if (e.key === 'Enter') {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    lastQuery = q; searchPage = 1;
    doSearch(q, 1, true);
  }
}

async function doSearch(q, page, fresh) {
  showView('searchView');
  document.getElementById('searchTitle').textContent = `Results for "${q}"`;
  if (fresh) document.getElementById('searchGrid').innerHTML = '';
  document.getElementById('resultsCount').textContent = 'Searching...';
  const d = await jikan(`/anime?q=${encodeURIComponent(q)}&limit=24&page=${page}`);
  const items = d.data || [];
  document.getElementById('resultsCount').textContent = `${d.pagination?.items?.total || items.length} results found`;
  document.getElementById('searchGrid').insertAdjacentHTML('beforeend', items.map(animeCard).join(''));
  document.getElementById('loadMoreWrap').style.display = d.pagination?.has_next_page ? 'block' : 'none';
}

function loadMoreResults() {
  searchPage++;
  doSearch(lastQuery, searchPage, false);
}

// ---- VIEWS ----
function showView(v) {
  ['homeView','watchView','searchView','filterView'].forEach(id => {
    const el = document.getElementById(id);
    if (id === 'homeView') {
      el.classList.toggle('hidden', v !== id);
    } else {
      el.classList.toggle('visible', v === id);
    }
  });
  if (v !== 'watchView') { currentAnime = null; }
}

function goHome() {
  showView('homeView');
  document.getElementById('searchInput').value = '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ---- INIT ----
renderGenres();
loadHero();
loadTrending();
loadSeasonal();
loadTopRated();
</script>
</body>
</html>
